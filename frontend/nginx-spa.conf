server {
  listen 80 default;
  server_name _;

  # Security headers. The SPA is fully self-hosted — its JS, CSS, fonts, and the
  # /api it talks to are all same-origin, and it loads nothing from a CDN — so the
  # policy is tight: same-origin only. This shrinks the XSS surface around the
  # in-tab vault key (the device key persisted in localStorage); a strict CSP is
  # defence-in-depth, not a substitute for not having XSS in the first place.
  # 'unsafe-inline' is allowed for styles only (Tailwind / injected styles), never
  # for scripts. `connect-src 'self'` stops a compromised page from exfiltrating
  # decrypted secrets to another origin.
  #
  # These live at the server level and there is no add_header in the location
  # below on purpose: nginx drops inherited add_headers from any block that sets
  # its own, so a per-location header here would silently disable this whole set.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
