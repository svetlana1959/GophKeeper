services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: gophkeeper
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gophkeeper"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrations:
    image: amacneil/dbmate:latest
    command: --no-dump-schema up
    environment:
      DATABASE_URL: postgres://postgres:docker@postgres:5432/gophkeeper?sslmode=disable
    volumes:
      - ./db:/db
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    # Mount source for live reload in development.
    volumes:
      - ./src:/app/src:delegated
    command:
      ["uvicorn", "gophkeeper.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
