[default.api]
application_name = "GophKeeper"
description = "Zero-knowledge secret store. The server only ever sees ciphertext."
trusted_hosts = ["*"]

[default.security]
# Local-dev HMAC key. Override in production via GOPH_SECURITY__SECRET_KEY.
secret_key = "dev-insecure-change-me"
challenge_ttl_seconds = 120
session_ttl_seconds = 3600

[default.run_settings]
logging_level = "INFO"

[default.server]
host = "0.0.0.0"
port = 8080
reload = false
workers = 1
